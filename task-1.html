<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Task 1 — Connect a bill provider</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/shared.css" />
<link rel="stylesheet" href="css/tasks.css" />
</head>
<body class="task-page">
  <div class="task-card">
    <p class="task-kicker">Task 1 of 5</p>
    <h1>Select a bill provider &amp; log in to their portal</h1>
    <p class="task-prompt">
      Find and select a bill provider to enroll for Connected Bill Retrieval, then connect
      the account and log in to that provider's portal.
    </p>
    <div class="task-actions">
      <button class="btn btn-primary" id="beginBtn">Begin Task 1</button>
    </div>
  </div>
  <script>
    document.getElementById('beginBtn').addEventListener('click', function () {
      sessionStorage.setItem('activeTask', '1');
      window.location.href = 'screens/home-empty.html';
    });
  </script>
</body>
</html>
